<!-- Hero Section -->
<section class="py-5 bg-light">
  <div class="container">
    <!-- Header -->
    <div class="text-center mb-5">
      <h1 class="fw-bold text-primary mb-4">Pricing Plans</h1>
      <p class="text-muted fs-5 mb-4">
        Choose the perfect plan for your business needs. Flexible pricing for every requirement.
      </p>
    </div>

    <!-- Pricing Categories -->
    <div class="row justify-content-center mb-5">
      <div class="col-md-10">
        <div class="d-flex flex-wrap justify-content-center gap-2 mb-4">
          <button class="btn" 
                  [class.btn-warning]="activeCategory === 'web-hosting'" 
                  [class.btn-outline-warning]="activeCategory !== 'web-hosting'" 
                  (click)="setCategory('web-hosting')">
            Web Hosting
          </button>
          <button class="btn" 
                  [class.btn-warning]="activeCategory === 'control-panel'" 
                  [class.btn-outline-warning]="activeCategory !== 'control-panel'" 
                  (click)="setCategory('control-panel')">
            Control Panel
          </button>
          <button class="btn" 
                  [class.btn-warning]="activeCategory === 'backup'" 
                  [class.btn-outline-warning]="activeCategory !== 'backup'" 
                  (click)="setCategory('backup')">
            Backup
          </button>
          <button class="btn" 
                  [class.btn-warning]="activeCategory === 'security'" 
                  [class.btn-outline-warning]="activeCategory !== 'security'" 
                  (click)="setCategory('security')">
            Security
          </button>
          <button class="btn" 
                  [class.btn-warning]="activeCategory === 'divers'" 
                  [class.btn-outline-warning]="activeCategory !== 'divers'" 
                  (click)="setCategory('divers')">
            Divers
          </button>
          <button class="btn" 
                  [class.btn-warning]="activeCategory === 'it-outsourcing'" 
                  [class.btn-outline-warning]="activeCategory !== 'it-outsourcing'" 
                  (click)="setCategory('it-outsourcing')">
            IT Outsourcing
          </button>
          <button class="btn" 
                  [class.btn-warning]="activeCategory === 'vps'" 
                  [class.btn-outline-warning]="activeCategory !== 'vps'" 
                  (click)="setCategory('vps')">
            VPS
          </button>
        </div>
      </div>
    </div>
  </div>
  <h2 class="pricing-title" *ngIf="activeCategory">
    {{ getCategoryTitle() }}
  </h2>
</section>

<app-web-hosting-plan *ngIf="activeCategory === 'web-hosting'"></app-web-hosting-plan>
<app-server-plans *ngIf="activeCategory === 'control-panel'"></app-server-plans>
<app-pricing-vps *ngIf="activeCategory === 'vps'"></app-pricing-vps>
<app-pricing-divers *ngIf="activeCategory === 'divers'"></app-pricing-divers>
<app-security-pricing *ngIf="activeCategory === 'security'"></app-security-pricing>
<app-backup-pricing *ngIf="activeCategory === 'backup'"></app-backup-pricing>
<app-outsourcing-pricing *ngIf="activeCategory === 'it-outsourcing'"></app-outsourcing-pricing>
