<div class="modal-backdrop" *ngIf="isOpen">
  <div class="modal">
    <button class="close-btn" (click)="closeModal()">×</button>

    <!-- Auth Container Inside Modal -->
    <div class="auth-container">

        <!-- Sign In Form -->
        <div class="auth-form" [class.active]="!showSignUp">
            <h2>Sign In</h2>
            <p class="auth-desc">Log in to your CloudConnect account</p>

            <!-- (Ton formulaire reactif ici — identique à ce que tu avais) -->
        </div>

        <!-- Sign Up Form -->
        <div class="auth-form" [class.active]="showSignUp">
            <h2>Create an Account</h2>
            <p class="auth-desc">Join CloudConnect and start hosting your projects</p>

            <!-- (Ton formulaire signup ici — identique) -->
        </div>

    </div>
  </div>
</div>
